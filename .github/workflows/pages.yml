name: Deploy Demo
# The workflow file only exists on branches that have the Vite demo, so pushes to
# branches without it never trigger a broken run.
on:
  push:
    branches: [master, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live site; newer deploys supersede in-flight ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bunx vite build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

      - id: deployment
        uses: actions/deploy-pages@v4
