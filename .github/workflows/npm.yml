name: Build and Publish
on: [push, pull_request]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2

      # Install dependencies (prepare runs the build)
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # Browser-mode tests run against real Chromium
      - run: bunx playwright install chromium --with-deps
      - run: bun run test

      # Validate the package the tarball consumers will actually get
      - run: bun run build
      - run: bunx publint
      # --exclude-entrypoints ./style.css: a CSS export has no JS/type resolution by design
      - run: bunx @arethetypeswrong/cli --pack --profile esm-only --exclude-entrypoints ./style.css .

  publishNpm:
    name: Publish Npm
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # Required for npm Trusted Publishing (OIDC); also enables provenance
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # npm CLI does the publish (Trusted Publishing); node 24 bundles a new enough npm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The tag must match the version being published
      - name: Check tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      # Install dependencies and Build
      - run: bun install --frozen-lockfile

      # Publish via Trusted Publishing (configured on npmjs.com; no token needed).
      # Prerelease versions go to the "next" dist-tag so "latest" stays on stable.
      - name: Publish
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac

  release:
    name: GitHub Release
    needs: publishNpm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Create a GitHub Release for the tag with generated notes
      - name: Create release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
